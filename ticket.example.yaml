# 交付工单：由装机的人填写，AI 读这个文件自动生成配置。
# 只有这里的东西需要"客户提供"，其余全部自动。

robot:
  qq: "10001"              # 机器人用的 QQ 号（建议小号）

allow:                     # 允许跟它聊天的 QQ 号，其他人的消息完全不回
  - "20002"

city: "杭州"               # 天气关怀用；留空则不报天气

api:
  base_url: "https://api.deepseek.com/v1"
  api_key: "sk-填这里"
  model: "deepseek-chat"

persona:
  name: "小柚"
  age: 20
  who: "在奶茶店做兼职"
  style: "短句、口语，爱用「呀」「啦」「嘛」，会撒娇也会损人"
  relation: "高中同学。你暗恋他三年没说出口，毕业后断了联系，最近刚重新联系上"
  # 可选：直接给一整段 prompt，填了就不再按上面字段拼
  prompt: ""
  # 可选：几句话的要点，--polish 时会交给模型润色成完整人格
  notes: ""
  # 可选：作息，不写用默认（1-8睡 / 8-17忙 / 17-22闲 / 22-1夜）
  life: []

# 可选：覆盖默认参数
tuning:
  history: 100            # 上下文条数，越大越贵
  tts_probability: 0.25   # 发语音概率
  sticker_probability: 0.35
  proactive_min_minutes: 45
  proactive_max_minutes: 180
  proactive_max_per_day: 6
  max_rounds: 0           # >0 时限制单次对话轮数（给贵模型兜底）
